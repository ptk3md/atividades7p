<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Calendário Acadêmico 2026</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* ─── APPLE DESIGN SYSTEM ─── */
  :root {
    /* Apple Color Tokens */
    --apple-action: #0066cc;
    --apple-focus: #0071e3;
    --apple-ink: #1d1d1f;
    --apple-sky: #2997ff;
    --apple-pearl: #fafafc;
    --apple-white: #ffffff;
    --apple-parchment: #f5f5f7;
    --apple-tile-1: #272729;
    --apple-tile-2: #2a2a2c;
    --apple-tile-3: #252527;
    --apple-black: #000000;
    --apple-muted-80: rgba(0, 0, 0, 0.8);
    --apple-muted-48: rgba(0, 0, 0, 0.48);
    --apple-divider: rgba(0, 0, 0, 0.04);
    --apple-hairline: rgba(0, 0, 0, 0.08);
    --apple-chip: rgba(210, 210, 215, 0.64);

    /* Semantic overrides for academic calendar */
    --danger: #cf4c4c;
    --success: #2ea073;
    --warning: #c78e28;
    --info: #4a7abd;

    /* Surfaces */
    --bg-color: var(--apple-white);
    --tile-bg: var(--apple-parchment);
    --card-bg: var(--apple-white);
    --card-border: var(--apple-hairline);
    --text-main: var(--apple-ink);
    --text-muted: var(--apple-muted-48);
    --text-inverse: var(--apple-white);

    /* Typography */
    --font-display: "SF Pro Display", "SF Pro Icons", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-text: "SF Pro Text", "SF Pro Icons", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;

    /* Spacing */
    --radius-pill: 980px;
    --radius-card: 18px;
    --radius-utility: 8px;
    --radius-pearl: 11px;
    --shadow-product: rgba(0, 0, 0, 0.22) 3px 5px 30px 0;
    --transition: 0.3s ease-in-out;
  }

  [data-theme="dark"] {
    --bg-color: var(--apple-black);
    --tile-bg: var(--apple-tile-1);
    --card-bg: var(--apple-tile-2);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: var(--apple-white);
    --text-muted: rgba(255, 255, 255, 0.55);
    --text-inverse: var(--apple-ink);
    --apple-hairline: rgba(255, 255, 255, 0.08);
    --apple-divider: rgba(255, 255, 255, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-text);
    background-color: var(--bg-color);
    color: var(--text-main);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color var(--transition), color var(--transition);
  }

  /* ─── GLOBAL NAV ─── */
  .global-nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--apple-black);
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 22px;
  }
  .global-nav-inner {
    width: 100%;
    max-width: 1024px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .global-nav a, .global-nav button {
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: -0.12px;
    color: var(--apple-white);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  .global-nav a:hover, .global-nav button:hover { opacity: 1; }
  .global-nav .nav-logo {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.374px;
    opacity: 1;
  }
  .global-nav .nav-actions { display: flex; gap: 20px; align-items: center; }

  /* ─── SUB NAV ─── */
  .sub-nav {
    position: sticky;
    top: 44px;
    z-index: 999;
    background: rgba(245, 245, 247, 0.8);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--apple-hairline);
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    transition: background-color var(--transition), border-color var(--transition);
  }
  [data-theme="dark"] .sub-nav {
    background: rgba(39, 39, 41, 0.8);
  }
  .sub-nav-inner {
    width: 100%;
    max-width: 1024px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sub-nav-title {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.374px;
    color: var(--apple-ink);
  }
  [data-theme="dark"] .sub-nav-title { color: var(--apple-white); }
  .sub-nav-meta {
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 400;
    color: var(--apple-muted-48);
    margin-left: 12px;
  }
  .sub-nav-actions { display: flex; gap: 12px; align-items: center; }

  /* ─── BUTTONS ─── */
  .btn-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--apple-action);
    color: var(--apple-white);
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.224px;
    border: none;
    border-radius: var(--radius-pill);
    padding: 8px 18px;
    cursor: pointer;
    transition: transform 0.15s, background-color 0.2s;
    text-decoration: none;
  }
  .btn-pill:hover { background: #0077ed; }
  .btn-pill:active { transform: scale(0.95); }
  .btn-pill:focus-visible { outline: 2px solid var(--apple-focus); outline-offset: 2px; }

  .btn-pill-ghost {
    background: transparent;
    color: var(--apple-action);
    border: 1px solid var(--apple-action);
  }
  .btn-pill-ghost:hover { background: rgba(0, 102, 204, 0.05); }

  .btn-utility {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--apple-ink);
    color: var(--apple-white);
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.224px;
    border: 1px solid transparent;
    border-radius: var(--radius-utility);
    padding: 8px 15px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .btn-utility:active { transform: scale(0.95); }
  .btn-utility:focus-visible { outline: 2px solid var(--apple-focus); outline-offset: 2px; }

  .btn-pearl {
    background: var(--apple-pearl);
    color: var(--apple-muted-80);
    border: 3px solid var(--apple-divider);
    border-radius: var(--radius-pearl);
    padding: 0 14px;
    height: 32px;
    font-size: 14px;
  }
  .btn-pearl:hover { background: var(--apple-white); }

  .btn-icon {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: var(--radius-utility);
    background: transparent;
    color: var(--apple-ink);
    border: 1px solid var(--apple-hairline);
  }
  [data-theme="dark"] .btn-icon { color: var(--apple-white); border-color: var(--card-border); }
  .btn-icon:hover { background: var(--apple-parchment); }
  [data-theme="dark"] .btn-icon:hover { background: var(--apple-tile-3); }

  /* ─── TILES ─── */
  .tile {
    width: 100%;
    padding: 64px 22px;
    display: flex;
    justify-content: center;
  }
  .tile-inner {
    width: 100%;
    max-width: 980px;
  }
  .tile-light { background: var(--apple-white); }
  .tile-parchment { background: var(--apple-parchment); }
  .tile-dark { background: var(--apple-tile-1); color: var(--apple-white); }
  .tile-dark .tile-headline { color: var(--apple-white); }
  .tile-dark .tile-subhead { color: rgba(255,255,255,0.8); }

  .tile-headline {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 600;
    line-height: 1.10;
    letter-spacing: -0.28px;
    color: var(--apple-ink);
    text-align: center;
    margin-bottom: 12px;
  }
  .tile-subhead {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 400;
    line-height: 1.19;
    letter-spacing: 0.231px;
    color: var(--apple-muted-48);
    text-align: center;
    margin-bottom: 24px;
  }

  /* ─── PROGRESS ─── */
  .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 32px;
  }
  .progress-fill {
    height: 100%;
    background: var(--apple-action);
    width: 0%;
    transition: width 1s ease-out;
    border-radius: 2px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-family: var(--font-text);
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    letter-spacing: -0.224px;
  }

  /* ─── FILTERS ─── */
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 8px 0;
  }
  .filter-pill {
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.224px;
    padding: 6px 16px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--apple-hairline);
    background: transparent;
    color: var(--apple-ink);
    cursor: pointer;
    transition: all 0.2s;
  }
  [data-theme="dark"] .filter-pill {
    color: var(--apple-white);
    border-color: var(--card-border);
  }
  .filter-pill:hover { border-color: var(--apple-action); color: var(--apple-action); }
  .filter-pill.active {
    background: var(--apple-action);
    color: var(--apple-white);
    border-color: var(--apple-action);
    transform: scale(1.03);
  }

  /* ─── EVENT CARDS (Apple Utility Card) ─── */
  .events-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .event-card {
    display: grid;
    grid-template-columns: 76px 1fr auto;
    align-items: stretch;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s;
    cursor: default;
  }
  .event-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-product);
    z-index: 2;
  }

  .date-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    background: var(--apple-parchment);
    border-right: 1px solid var(--apple-hairline);
    transition: background-color var(--transition);
  }
  [data-theme="dark"] .date-box {
    background: var(--apple-tile-3);
    border-right-color: var(--card-border);
  }
  .date-day {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.07;
    letter-spacing: -0.28px;
    color: var(--apple-ink);
  }
  [data-theme="dark"] .date-day { color: var(--apple-white); }
  .date-month {
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: -0.12px;
    margin-top: 2px;
    color: var(--apple-muted-48);
  }

  .info-box {
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .card-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .event-name {
    font-family: var(--font-text);
    font-size: 17px;
    font-weight: 600;
    line-height: 1.24;
    letter-spacing: -0.374px;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-disc {
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.43;
    letter-spacing: -0.224px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .type-indicator {
    width: 5px;
    height: 100%;
    transition: background-color var(--transition);
  }

  /* Type colors applied to indicator and date accent */
  .type-prova .type-indicator { background: var(--danger); }
  .type-prova .date-box { border-left: 3px solid var(--danger); }
  .type-pratica .type-indicator { background: var(--success); }
  .type-pratica .date-box { border-left: 3px solid var(--success); }
  .type-trabalho .type-indicator { background: var(--info); }
  .type-trabalho .date-box { border-left: 3px solid var(--info); }
  .type-final .type-indicator { background: var(--warning); }
  .type-final .date-box { border-left: 3px solid var(--warning); }
  .type-outros .type-indicator { background: var(--text-muted); }
  .type-outros .date-box { border-left: 3px solid var(--text-muted); }

  .actions {
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-add-cal {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-add-cal:hover {
    background: var(--apple-parchment);
    color: var(--apple-action);
    transform: scale(1.1);
  }
  [data-theme="dark"] .btn-add-cal:hover { background: var(--apple-tile-3); }
  .btn-add-cal svg { width: 20px; height: 20px; }

  /* ─── BADGES ─── */
  .badge {
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    letter-spacing: -0.12px;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background-color var(--transition), color var(--transition);
  }
  .badge-today {
    background: var(--danger);
    color: var(--apple-white);
    animation: pulse 2s infinite;
  }
  .badge-soon {
    background: var(--warning);
    color: var(--apple-ink);
  }
  .badge-info {
    background: var(--apple-parchment);
    color: var(--apple-muted-80);
    border: 1px solid var(--apple-hairline);
  }
  [data-theme="dark"] .badge-info {
    background: var(--apple-tile-3);
    color: rgba(255,255,255,0.7);
    border-color: var(--card-border);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* ─── MONTH HEADER ─── */
  .month-header {
    position: sticky;
    top: 96px;
    z-index: 10;
    background: var(--tile-bg);
    backdrop-filter: blur(10px);
    padding: 14px 0;
    margin-bottom: 16px;
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: 0.196px;
    color: var(--apple-action);
    border-bottom: 1px solid var(--apple-hairline);
    text-transform: capitalize;
    transition: background-color var(--transition), color var(--transition), border-color var(--transition);
  }

  /* ─── ARCHIVE ─── */
  .archive-section { margin-top: 0; }
  .btn-archive-toggle {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    background: transparent;
    color: var(--apple-sky);
    font-family: var(--font-text);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.374px;
    border: none;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: opacity 0.2s;
  }
  .btn-archive-toggle:hover { opacity: 0.7; }
  .event-card.is-past {
    opacity: 0.45;
    filter: grayscale(0.8);
  }
  .event-card.is-past:hover {
    opacity: 0.7;
    filter: grayscale(0.4);
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 64px 22px;
    font-family: var(--font-text);
    font-size: 21px;
    font-weight: 400;
    line-height: 1.19;
    color: var(--text-muted);
    letter-spacing: 0.231px;
  }

  /* ─── SKELETON ─── */
  .skeleton {
    background: linear-gradient(90deg, var(--apple-parchment) 25%, var(--apple-white) 50%, var(--apple-parchment) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
  }
  [data-theme="dark"] .skeleton {
    background: linear-gradient(90deg, var(--apple-tile-3) 25%, var(--apple-tile-2) 50%, var(--apple-tile-3) 75%);
    background-size: 200% 100%;
  }
  .sk-card { height: 90px; border-radius: var(--radius-card); margin-bottom: 12px; }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ─── COMPACT OVERLAY ─── */
  .compact-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: var(--apple-white);
    overflow-y: auto;
  }
  [data-theme="dark"] .compact-overlay { background: var(--apple-black); }
  .compact-overlay.active { display: block; }
  .compact-inner { padding: 24px 22px 40px; max-width: 720px; margin: 0 auto; }
  .compact-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--apple-hairline);
  }
  .compact-header-title {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.374px;
    color: var(--apple-ink);
  }
  [data-theme="dark"] .compact-header-title { color: var(--apple-white); }
  .compact-header-subtitle {
    font-family: var(--font-text);
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: -0.224px;
  }
  .compact-grid { display: flex; flex-direction: column; gap: 4px; }
  .compact-month {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.374px;
    color: var(--apple-action);
    text-transform: uppercase;
    padding: 12px 0 6px;
    margin-top: 8px;
    border-bottom: 1px solid var(--apple-hairline);
  }
  .compact-month:first-child { margin-top: 0; }
  .compact-row {
    display: grid;
    grid-template-columns: 40px 4px 1fr auto;
    align-items: center;
    gap: 0 10px;
    padding: 8px 10px;
    border-radius: var(--radius-utility);
    background: var(--apple-parchment);
    transition: background-color var(--transition);
  }
  [data-theme="dark"] .compact-row { background: var(--apple-tile-3); }
  .compact-date {
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.224px;
    color: var(--apple-ink);
    text-align: center;
    line-height: 1.1;
  }
  [data-theme="dark"] .compact-date { color: var(--apple-white); }
  .compact-date em {
    display: block;
    font-style: normal;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: -0.08px;
    opacity: 0.6;
    color: var(--text-muted);
  }
  .compact-dot {
    width: 4px;
    border-radius: 99px;
    height: 32px;
    flex-shrink: 0;
  }
  .compact-text { min-width: 0; }
  .compact-title {
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.224px;
    color: var(--apple-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  [data-theme="dark"] .compact-title { color: var(--apple-white); }
  .compact-disc {
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: -0.12px;
    color: var(--text-muted);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .compact-badge {
    font-family: var(--font-text);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: -0.08px;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .compact-row.type-prova .compact-dot { background: var(--danger); }
  .compact-row.type-pratica .compact-dot { background: var(--success); }
  .compact-row.type-trabalho .compact-dot { background: var(--info); }
  .compact-row.type-final .compact-dot { background: var(--warning); }
  .compact-row.type-outros .compact-dot { background: var(--text-muted); }

  .compact-legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--apple-hairline);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.12px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .legend-dot.prova { background: var(--danger); }
  .legend-dot.pratica { background: var(--success); }
  .legend-dot.trabalho { background: var(--info); }
  .legend-dot.final { background: var(--warning); }

  /* ─── FOOTER ─── */
  .site-footer {
    background: var(--apple-parchment);
    padding: 40px 22px;
    text-align: center;
    border-top: 1px solid var(--apple-hairline);
  }
  [data-theme="dark"] .site-footer {
    background: var(--apple-tile-3);
    border-top-color: var(--card-border);
  }
  .site-footer p {
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: -0.12px;
    color: var(--apple-muted-48);
    line-height: 1.3;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 734px) {
    .tile { padding: 48px 18px; }
    .tile-headline { font-size: 32px; letter-spacing: -0.28px; }
    .tile-subhead { font-size: 19px; }
    .event-card { grid-template-columns: 64px 1fr auto; }
    .date-box { padding: 0 8px; }
    .date-day { font-size: 24px; }
    .info-box { padding: 14px 16px; }
    .month-header { top: 88px; font-size: 24px; }
    .sub-nav-title { font-size: 19px; }
    .sub-nav { padding: 0 18px; }
    .global-nav { padding: 0 18px; }
    .compact-inner { padding: 18px; }
  }

  @media (max-width: 419px) {
    .tile-headline { font-size: 28px; }
    .event-card { grid-template-columns: 56px 1fr auto; }
    .date-day { font-size: 21px; }
    .event-name { font-size: 16px; }
    .card-top-row { flex-wrap: wrap; gap: 6px; }
    .badge { margin-left: 0; }
    .sub-nav { height: auto; padding: 10px 18px; }
    .sub-nav-inner { flex-wrap: wrap; gap: 8px; }
  }
</style>
<base target="_blank">
</head>
<body>

<!-- GLOBAL NAV -->
<nav class="global-nav">
  <div class="global-nav-inner">
    <a href="#" class="nav-logo">Calendário</a>
    <div class="nav-actions">
      <button class="btn-icon" id="btnCompact" title="Modo Reduzido">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h10M4 18h7"/></svg>
      </button>
      <button class="btn-icon" id="themeBtn" title="Alternar tema">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </div>
</nav>

<!-- SUB NAV -->
<div class="sub-nav">
  <div class="sub-nav-inner">
    <div style="display:flex;align-items:baseline;">
      <span class="sub-nav-title" id="appTitle">Calendário</span>
      <span class="sub-nav-meta" id="appSubtitle">Carregando...</span>
    </div>
    <div class="sub-nav-actions">
      <span class="badge badge-info" id="progressLabel" style="margin:0;">0%</span>
    </div>
  </div>
</div>

<!-- COMPACT OVERLAY -->
<div class="compact-overlay" id="compactOverlay">
  <div class="compact-inner">
    <div class="compact-header">
      <div>
        <div class="compact-header-title" id="compactTitle">Calendário</div>
        <div class="compact-header-subtitle">Modo Reduzido — print-friendly</div>
      </div>
      <button class="btn-utility" id="btnCloseCompact">✕ Fechar</button>
    </div>
    <div class="compact-grid" id="compactGrid"></div>
    <div class="compact-legend">
      <div class="legend-item"><div class="legend-dot prova"></div>Prova</div>
      <div class="legend-item"><div class="legend-dot pratica"></div>Prática</div>
      <div class="legend-item"><div class="legend-dot trabalho"></div>Trabalho</div>
      <div class="legend-item"><div class="legend-dot final"></div>Final</div>
    </div>
  </div>
</div>

<!-- HERO / PROGRESS TILE -->
<section class="tile tile-dark">
  <div class="tile-inner">
    <h1 class="tile-headline" id="heroTitle">Calendário Acadêmico</h1>
    <p class="tile-subhead" id="heroSubtitle">Acompanhe seu semestre</p>
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="progress-meta">
      <span>Início do semestre</span>
      <span id="progressText">0% concluído</span>
      <span>Fim do semestre</span>
    </div>
  </div>
</section>

<!-- FILTERS TILE -->
<section class="tile tile-parchment">
  <div class="tile-inner">
    <div class="filter-bar" id="disciplineFilters"></div>
  </div>
</section>

<!-- EVENTS TILE -->
<section class="tile tile-parchment" style="padding-top:0;">
  <div class="tile-inner">
    <main id="eventsContainer" class="events-grid"></main>
  </div>
</section>

<!-- ARCHIVE TILE -->
<section class="tile tile-dark" id="archiveSection" style="display:none;">
  <div class="tile-inner">
    <button class="btn-archive-toggle" id="btnToggleArchive">Ver Histórico (<span id="archiveCount">0</span>)</button>
    <div id="archiveContainer" class="events-grid" style="margin-top: 24px; display: none;"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
  <p>Calendário Acadêmico · Design inspirado na linguagem visual Apple</p>
</footer>

<script>
/* ─── DATA LOADER ─── */
const script = document.createElement('script');
script.src = 'data.js?v=' + new Date().getTime();
document.body.appendChild(script);
script.onload = () => new App();
script.onerror = () => {
  // Fallback demo data so the page still renders
  window.EXTERNAL_CONFIG = {
    title: "Calendário Acadêmico",
    subtitle: "2026.1",
    year: 2026,
    semesterStart: "2026-02-01",
    semesterEnd: "2026-07-01",
    data: [
      { d: "15/04", title: "Prova 1 — Cálculo III", disc: "Cálculo III", type: "prova" },
      { d: "22/04", title: "Entrega Trabalho — Física", disc: "Física", type: "trabalho" },
      { d: "28/04", title: "Prova 2 — Álgebra Linear", disc: "Álgebra Linear", type: "prova" },
      { d: "05/05", title: "Aula Prática — Química", disc: "Química", type: "pratica" },
      { d: "20/05", title: "Prova Final — Cálculo III", disc: "Cálculo III", type: "final" },
    ]
  };
  new App();
};

class App {
  constructor() {
    this.events = [];
    this.today = new Date(); this.today.setHours(0,0,0,0);
    this.state = { activeDisc: 'Todas', isArchiveOpen: false };

    if (typeof EXTERNAL_CONFIG === 'undefined') return;
    this.renderSkeleton();
    setTimeout(() => this.init(), 400);
  }

  init() {
    const CONFIG = EXTERNAL_CONFIG;
    this.events = CONFIG.data.map(item => {
      const [d, m] = item.d.split('/').map(Number);
      const dateObj = new Date(CONFIG.year, m - 1, d);
      return { ...item, dateObj, sortTime: dateObj.getTime() };
    }).sort((a, b) => a.sortTime - b.sortTime);

    document.getElementById('appTitle').innerText = CONFIG.title;
    document.getElementById('appSubtitle').innerText = CONFIG.subtitle;
    document.getElementById('heroTitle').innerText = CONFIG.title;
    document.getElementById('heroSubtitle').innerText = CONFIG.subtitle;
    document.getElementById('compactTitle').innerText = `${CONFIG.title} · ${CONFIG.subtitle}`;

    this.setupTheme();
    this.setupFilters();
    this.setupArchive();
    this.setupCompactMode();
    this.updateProgress(CONFIG);
    this.render();
  }

  updateProgress(config) {
    const start = new Date(config.semesterStart);
    const end = new Date(config.semesterEnd);
    const total = end - start;
    const current = this.today - start;
    let pct = Math.floor((current / total) * 100);
    if (pct < 0) pct = 0; if (pct > 100) pct = 100;
    document.getElementById('progressBar').style.width = `${pct}%`;
    document.getElementById('progressLabel').innerText = `${pct}%`;
    document.getElementById('progressText').innerText = `${pct}% concluído`;
  }

  renderSkeleton() {
    document.getElementById('eventsContainer').innerHTML = Array(4).fill('<div class="skeleton sk-card"></div>').join('');
  }

  setupTheme() {
    const btn = document.getElementById('themeBtn');
    let isDark = localStorage.getItem('theme') !== 'light';
    const apply = () => document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
    apply();
    btn.onclick = () => { isDark = !isDark; localStorage.setItem('theme', isDark ? 'dark' : 'light'); apply(); };
  }

  setupFilters() {
    const uniqueDiscs = ['Todas', ...new Set(this.events.map(e => e.disc))]
        .filter(d => d !== 'Início do caos');

    const container = document.getElementById('disciplineFilters');
    container.innerHTML = '';
    uniqueDiscs.forEach(disc => {
      const btn = document.createElement('button');
      btn.className = `filter-pill ${disc === 'Todas' ? 'active' : ''}`;
      btn.textContent = disc;
      btn.onclick = (e) => {
        this.state.activeDisc = disc;
        document.querySelectorAll('.filter-pill').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        this.render();
      };
      container.appendChild(btn);
    });
  }

  setupArchive() {
    const btn = document.getElementById('btnToggleArchive');
    btn.onclick = () => {
        this.state.isArchiveOpen = !this.state.isArchiveOpen;
        const container = document.getElementById('archiveContainer');
        container.style.display = this.state.isArchiveOpen ? 'flex' : 'none';
        btn.innerText = this.state.isArchiveOpen ? "Ocultar Histórico" : `Ver Histórico (${document.getElementById('archiveCount').innerText})`;
    };
  }

  setupCompactMode() {
    const overlay = document.getElementById('compactOverlay');
    const btnOpen = document.getElementById('btnCompact');
    const btnClose = document.getElementById('btnCloseCompact');

    btnOpen.onclick = () => { this.renderCompact(); overlay.classList.add('active'); overlay.scrollTop = 0; };
    btnClose.onclick = () => overlay.classList.remove('active');
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('active'); });
  }

  renderCompact() {
    const grid = document.getElementById('compactGrid');
    grid.innerHTML = '';
    const allEvents = [...this.events].filter(ev => ev.disc !== 'Início do caos');
    let currentMonth = '';

    allEvents.forEach(ev => {
      const evMonth = ev.dateObj.toLocaleString('pt-BR', { month: 'long' });
      const evYear = ev.dateObj.getFullYear();
      const monthKey = `${evMonth} ${evYear}`;
      if (monthKey !== currentMonth) {
        currentMonth = monthKey;
        const header = document.createElement('div');
        header.className = 'compact-month';
        header.innerText = monthKey;
        grid.appendChild(header);
      }
      const isPast = ev.dateObj < this.today;
      const { day, month } = this.fmtBox(ev.dateObj);
      let urgencyHtml = '';
      if (!isPast) {
        const diffDays = Math.ceil((ev.dateObj - this.today) / (1000 * 60 * 60 * 24));
        if (diffDays === 0) urgencyHtml = `<span class="compact-badge badge-today">Hoje</span>`;
        else if (diffDays === 1) urgencyHtml = `<span class="compact-badge badge-soon">Amanhã</span>`;
        else if (diffDays <= 7) urgencyHtml = `<span class="compact-badge badge-soon">${diffDays}d</span>`;
      }
      const row = document.createElement('div');
      row.className = `compact-row type-${ev.type}${isPast ? ' is-past' : ''}`;
      row.innerHTML = `
        <div class="compact-date">${day}<em>${month}</em></div>
        <div class="compact-dot"></div>
        <div class="compact-text">
          <div class="compact-title">${ev.title}</div>
          <div class="compact-disc">${ev.disc}</div>
        </div>
        ${urgencyHtml}
      `;
      grid.appendChild(row);
    });
  }

  fmtBox(d) { return { day: d.getDate().toString().padStart(2,'0'), month: d.toLocaleString('pt-BR',{month:'short'}).replace('.','') }; }

  openGoogleCalendar(ev) {
    const fmt = (d) => d.toISOString().replace(/-|:|\.\d\d\d/g, "").slice(0, 15) + "Z";
    const start = fmt(ev.dateObj);
    const endDate = new Date(ev.dateObj); endDate.setHours(endDate.getHours() + 1);
    const end = fmt(endDate);
    const details = encodeURIComponent(`${ev.disc} - ${ev.type}.`);
    const title = encodeURIComponent(ev.title);
    window.open(`https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}&sf=true&output=xml`, '_blank');
  }

  getUrgency(dateObj) {
    const diffTime = dateObj - this.today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    if (diffDays === 0) return { text: 'Hoje!', class: 'badge-today' };
    if (diffDays === 1) return { text: 'Amanhã', class: 'badge-soon' };
    if (diffDays > 1 && diffDays <= 7) return { text: `${diffDays} dias`, class: 'badge-soon' };
    return { text: `${diffDays} dias`, class: 'badge-info' };
  }

  createCard(ev, isPast, index) {
    const { day, month } = this.fmtBox(ev.dateObj);
    let urgency = null;
    if (!isPast) urgency = this.getUrgency(ev.dateObj);

    const el = document.createElement('div');
    el.className = `event-card type-${ev.type} ${isPast ? 'is-past' : ''}`;

    const btnCal = document.createElement('button');
    btnCal.className = 'btn-add-cal';
    btnCal.title = "Abrir no Google Calendar";
    btnCal.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`;
    btnCal.onclick = (e) => { e.stopPropagation(); this.openGoogleCalendar(ev); };

    const badgeVisible = !isPast && index < 3;
    el.innerHTML = `
      <div class="date-box">
        <div class="date-day">${day}</div>
        <div class="date-month">${month}</div>
      </div>
      <div class="info-box">
        <div class="card-top-row">
           <div class="event-name">${ev.title}</div>
           ${urgency ? `<div class="badge ${urgency.class}" style="${badgeVisible ? '' : 'display:none'}">${urgency.text}</div>` : ''}
        </div>
        <div class="event-disc">${ev.disc}</div>
      </div>
      <div class="type-indicator" title="${ev.type}"></div>
    `;

    if (!isPast && urgency) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        if (e.target.closest('.btn-add-cal')) return;
        const badge = el.querySelector('.badge');
        if (badge) badge.style.display = badge.style.display === 'none' ? '' : 'none';
      });
    }

    const actions = document.createElement('div'); actions.className = 'actions';
    actions.appendChild(btnCal); el.appendChild(actions);
    return el;
  }

  render() {
    const mainContainer = document.getElementById('eventsContainer');
    const archiveContainer = document.getElementById('archiveContainer');
    const filtered = this.events.filter(ev => {
        const inDisc = this.state.activeDisc === 'Todas' || ev.disc === this.state.activeDisc;
        return inDisc;
    });
    const futureEvents = filtered.filter(ev => ev.dateObj >= this.today);
    const pastEvents = filtered.filter(ev => ev.dateObj < this.today);

    document.getElementById('archiveCount').innerText = pastEvents.length;
    document.getElementById('archiveSection').style.display = pastEvents.length > 0 ? 'flex' : 'none';

    mainContainer.innerHTML = '';
    if (futureEvents.length === 0) {
        mainContainer.innerHTML = `<div class="empty-state">Nada pendente no calendário.</div>`;
    } else {
        let currentMonth = '';
        futureEvents.forEach((ev, index) => {
            const evMonth = ev.dateObj.toLocaleString('pt-BR', { month: 'long' });
            if (evMonth !== currentMonth) {
                currentMonth = evMonth;
                const header = document.createElement('div');
                header.className = 'month-header';
                header.innerText = currentMonth;
                mainContainer.appendChild(header);
            }
            mainContainer.appendChild(this.createCard(ev, false, index));
        });
    }

    archiveContainer.innerHTML = '';
    pastEvents.forEach(ev => archiveContainer.appendChild(this.createCard(ev, true)));
  }
}
</script>
</body>
</html>
